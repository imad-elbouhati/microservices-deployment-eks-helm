apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
spec:
  storageClassName: cloud-ssd
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: cloud-ssd
# Uses the EBS CSI driver (provisioned in terraform/csi-driver-addon.tf),
# not the deprecated in-tree "kubernetes.io/aws-ebs" provisioner.
provisioner: ebs.csi.aws.com
parameters:
  type: gp3