name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Scans the diff for accidentally committed secrets. No secrets required
  # to run; this is what would have caught the leaked key this project
  # originally shipped with.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Lints every Dockerfile. No secrets required.
  dockerfile-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, ui, weather]
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.service }}/Dockerfile
          config: .hadolint.yaml

  # Lints all three Helm charts, then validates the rendered manifests
  # against the Kubernetes API schema (with ingress/autoscaling enabled,
  # so those templates are checked too, not just the default-off path).
  # No secrets required.
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint charts
        run: |
          for chart in helm/weatherapp-auth helm/weatherapp-ui helm/weatherapp-weather; do
            helm lint "$chart"
          done
      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
      - name: Validate rendered manifests against Kubernetes schema
        run: |
          helm template t helm/weatherapp-auth --set jwtSecret=x --set ingress.enabled=true --set autoscaling.enabled=true \
            | kubeconform -kubernetes-version 1.29.0 -summary -strict -ignore-missing-schemas
          helm template t helm/weatherapp-ui --set jwtSecret=x --set ingress.enabled=true --set autoscaling.enabled=true \
            | kubeconform -kubernetes-version 1.29.0 -summary -strict -ignore-missing-schemas
          helm template t helm/weatherapp-weather --set apiKey=x --set ingress.enabled=true --set autoscaling.enabled=true \
            | kubeconform -kubernetes-version 1.29.0 -summary -strict -ignore-missing-schemas

  # Validates Terraform formatting and configuration. No AWS credentials
  # required — `terraform validate` checks syntax/references, not real
  # infrastructure.
  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt -check
        working-directory: terraform
        run: terraform fmt -check -recursive
      - name: terraform init (no backend)
        working-directory: terraform
        run: terraform init -backend=false
      - name: terraform validate
        working-directory: terraform
        run: terraform validate

  # Builds every service image and scans it with Trivy. Findings are
  # uploaded to the repository's Security tab (Code scanning alerts) rather
  # than failing the build outright, since most findings at this stage
  # trace back to upstream base-image CVEs outside this project's control.
  build:
    needs: [secret-scan, dockerfile-lint, helm-lint, terraform-validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        service: [auth, ui, weather]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.service }} image
        run: docker build -t weatherapp-${{ matrix.service }}:${{ github.sha }} ./${{ matrix.service }}
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: weatherapp-${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.service }}

  # Pushes images to GHCR on pushes to main. Uses the built-in GITHUB_TOKEN,
  # so it works without any repository secrets being configured.
  push:
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [auth, ui, weather]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.service }}
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/weatherapp-${{ matrix.service }}
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" ./${{ matrix.service }}
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  # Deploys to EKS via Helm. Intentionally manual (workflow_dispatch) rather
  # than automatic on every push — this repository targets project-based
  # infrastructure delivery, not always-on production deploys. Requires
  # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION, DB_PASSWORD,
  # JWT_SECRET and APIKEY to be configured as repository secrets; without
  # them configured, this job simply isn't triggered (workflow_dispatch is
  # opt-in), so it never blocks the rest of the pipeline from going green.
  deploy:
    needs: [push]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - uses: azure/setup-helm@v4
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name eks-cluster-weather --region "${{ secrets.AWS_REGION }}"
      - name: Deploy weatherapp-auth
        working-directory: helm/weatherapp-auth
        run: |
          helm dependency build .
          helm upgrade --install weatherapp-auth -n staging \
            --set mysql.auth.rootPassword="${{ secrets.DB_PASSWORD }}" \
            --set jwtSecret="${{ secrets.JWT_SECRET }}" \
            --set image.tag="${{ github.sha }}" .
      - name: Deploy weatherapp-ui
        working-directory: helm/weatherapp-ui
        run: |
          helm upgrade --install weatherapp-ui -n staging \
            --set jwtSecret="${{ secrets.JWT_SECRET }}" \
            --set image.tag="${{ github.sha }}" .
      - name: Deploy weatherapp-weather
        working-directory: helm/weatherapp-weather
        run: |
          helm upgrade --install weatherapp-weather -n staging \
            --set apiKey="${{ secrets.APIKEY }}" \
            --set image.tag="${{ github.sha }}" .
